<section>
  <header>
    <hgroup>
      <h2>Transaksi Penjualan</h2>
      <p>Pilih produk dan proses transaksi pelanggan</p>
    </hgroup>
  </header>

  <!-- Search & Filter -->
  <div class="search-bar">
    <input
      type="search"
      id="trx-product-search"
      placeholder="Cari produk (nama atau SKU)"
    />
  </div>

  <div id="transaction-message" role="alert" style="display: none"></div>

  <div class="transaction-layout">
    <!-- Data Produk -->
    <section class="transaction-products">
      <figure>
        <table role="grid">
          <thead>
            <tr>
              <th>SKU</th>
              <th>Nama</th>
              <th>Harga</th>
              <th>Stok</th>
              <th></th>
            </tr>
          </thead>

          <tbody id="transaction-product-table">
            <!-- Render Product -->
          </tbody>
        </table>
      </figure>
    </section>

    <!-- Keranjang + Member -->
    <aside class="cart-panel">
      <!-- Panel Member (BARU) -->
      <article id="member-panel">
        <header>
          <strong>Member</strong>
        </header>

        <!-- Tampil saat belum ada member dipilih -->
        <div id="member-search-area">
          <input
            type="search"
            id="member-search-input"
            placeholder="Cari member (nama/HP), kosongkan untuk non-member"
          />
          <div id="member-search-results"></div>
        </div>

        <!-- Tampil saat member sudah dipilih -->
        <div id="member-selected-area" style="display: none">
          <p>
            <strong id="member-selected-name"></strong>
            <br />
            <small id="member-selected-info"></small>
          </p>
          <label>
            Redeem Poin (opsional)
            <input type="number" id="member-redeem-input" min="0" value="0" />
          </label>
          <button type="button" id="btn-clear-member" class="outline secondary">
            Ganti / Batal Member
          </button>
        </div>
      </article>

      <!-- Panel Keranjang -->
      <article>
        <header>
          <strong>Keranjang</strong>
        </header>

        <div id="cart-items"></div>
        <hr />
        <div class="cart-summary">
          <p>
            <strong>Total Item</strong>
            <span id="cart-total-item"> 0 </span>
          </p>
          <p>
            <strong>Total Harga</strong>
            <span id="cart-total-price"> Rp 0 </span>
          </p>
        </div>

        <button id="btn-process-transaction">Proses Transaksi</button>
      </article>
    </aside>
  </div>
</section>

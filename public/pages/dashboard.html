<section>
  <header>
    <hgroup>
      <h2>Dashboard</h2>
      <p>Ringkasan aktivitas Mini POS hari ini</p>
    </hgroup>
  </header>

  <!-- Metrics Card -->
  <div class="grid">
    <article>
      <header>Revenue Hari Ini</header>
      <p id="today-revenue" style="font-size: 1.5rem; font-weight: bold">
        Rp 0
      </p>
    </article>
    <article>
      <header>Transaction Hari Ini</header>
      <p id="today-trx" style="font-size: 1.5rem; font-weight: bold">0</p>
    </article>
    <article>
      <header>Product Low Stock</header>
      <p id="low-stock-count" style="font-size: 1.5rem; font-weight: bold">0</p>
    </article>
  </div>

  <!-- Low Stock Alert -->
  <article>
    <header>Produk Perlu Restock</header>
    <table role="grid">
      <thead>
        <tr>
          <th>SKU</th>
          <th>Nama</th>
          <th>Stok Sisa</th>
        </tr>
      </thead>
      <tbody id="low-stock-table">
        <!-- Rows di-render oleh DashboardView -->
      </tbody>
    </table>
  </article>

  <!-- Member Metrics Card -->
  <div class="grid">
    <article>
      <header>Total Member</header>
      <p id="member-total-count" style="font-size: 1.5rem; font-weight: bold">
        0
      </p>
    </article>
    <article>
      <header>Member REGULAR</header>
      <p id="member-regular-count" style="font-size: 1.5rem; font-weight: bold">
        0
      </p>
    </article>
    <article>
      <header>Member GOLD</header>
      <p id="member-gold-count" style="font-size: 1.5rem; font-weight: bold">
        0
      </p>
    </article>
    <article>
      <header>Member VIP</header>
      <p id="member-vip-count" style="font-size: 1.5rem; font-weight: bold">
        0
      </p>
    </article>
    <article>
      <header>Total Poin Member</header>
      <p id="member-total-points" style="font-size: 1.5rem; font-weight: bold">
        0
      </p>
    </article>
  </div>

  <!-- Top Customers -->
  <article>
    <header>Top Customers</header>
    <table role="grid">
      <thead>
        <tr>
          <th>Nama</th>
          <th>Tier</th>
          <th>Total Belanja</th>
          <th>Total Poin</th>
        </tr>
      </thead>
      <tbody id="top-customers-table">
        <!-- Rows di-render oleh DashboardView -->
      </tbody>
    </table>
  </article>
</section>
